# Cloud Build — colaberry-ai frontend (Release-1.0)
# Trigger: Push to Release-1.0 branch
# Deploys to Cloud Run service: colaberry-ai-prod

steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "CMS_API_TOKEN=${_CMS_API_TOKEN}"
      - "--build-arg"
      - "NEXT_PUBLIC_VOICE_AGENT_URL=${_NEXT_PUBLIC_VOICE_AGENT_URL}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/colaberry-ai:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/colaberry-ai:latest"
      - "."

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/colaberry-ai"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/colaberry-ai:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "3000"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--concurrency"
      - "80"
      - "--timeout"
      - "300"
      - "--allow-unauthenticated"
      - "--update-env-vars"
      - "NODE_ENV=production"

substitutions:
  _REGION: us-east1
  _REPO: cloud-run-source-deploy
  _CMS_API_TOKEN: ""
  _SERVICE_NAME: colaberry-ai-prod
  # Voice Agent demo Cloud Run URL. Empty string by default — the iframe
  # wrapper falls back to localhost. Set via Cloud Build trigger
  # substitution (or `--substitutions=_NEXT_PUBLIC_VOICE_AGENT_URL=...`)
  # once the `voice-agent-demo` service is deployed.
  _NEXT_PUBLIC_VOICE_AGENT_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/colaberry-ai:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/colaberry-ai:latest"
